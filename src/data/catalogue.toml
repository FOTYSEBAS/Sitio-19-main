# ------------------------------------------------------------------------------
# 3. ALMANAQUE PERSONALIZADO ([almanac.enemies.<id>] y [almanac.towers.<id>])
# ------------------------------------------------------------------------------
# Aquí cambias descripción, lore, protocolo, campos clasificados, estadísticas,
# icono/orden de barras, diseño visual (designId de src/data/json/designs/) y animaciones.

[almanac.enemies.scp_008]
code = "SCP-008"
title = "Plaga Zombi"
subtitle = "Vector Priónico Clase Euclid · Contagio Biológico"
classification = "Euclid"
badgeText = "BIO-RIESGO"
accentColor = "#84CC16"
clearanceLevel = "Nivel 2 / Bioseguridad"
threatRating = "Moderado — Propagación en horda"
lore = "El agente SCP-008 es un prión complejo almacenado bajo cuarentena estricta en el Sitio-19. Los sujetos infectados experimentan fallo orgánico aparente seguido de reanimación agresiva sin respuesta al dolor."
containmentProcedures = "Mantener línea de fuego continua con Guardias y unidades ligeras. Neutralizar en pasillos exteriores antes de que alcancen las compuertas de evacuación."
tacticalNote = "Amenaza base de velocidad media. Vulnerable a fuego sostenido y ralentización táctica."
quote = "No sienten dolor, fatiga ni duda; cada brecha debe sellarse antes del contacto cuerpo a cuerpo."
author = "Dr. Gears — Informe de Contención Sector I"
tags = ["Biológico", "Euclid", "Horda", "Contagio"]
visualMode = "both"
designId = "enemies:scp_008"
portraitFit = "contain"
portraitBg = "#0A130F"
cardBg = "#0E1612"
cardBorderColor = "rgba(132, 204, 22, 0.35)"

