# ==============================================================================
# SITIO-19: CATÁLOGO MAESTRO (TOML / JSON)
# ==============================================================================
# Archivo central de personalización de Sitio-19.
# Todo lo definido aquí se fusiona sobre src/data/json/ y src/data/toml/ con máxima prioridad.
# También puedes usar src/data/catalogue.json, src/data/catalogue.jsonc o src/data/catalogue/*.toml
#
# Prioridad de carga:
#   src/data/json/* -> src/data/toml/* -> src/data/catalogue/* -> src/data/json/catalogue.* -> src/data/toml/catalogue.* -> src/data/catalogue.{json,jsonc,toml}
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. INTERFAZ GLOBAL, PANTALLAS, HUD Y ALMANAQUE ([ui])
# ------------------------------------------------------------------------------
[ui.theme]
accentColor = "#F59E0B"
secondaryAccent = "#38BDF8"
dangerColor = "#EF4444"
successColor = "#10B981"
surfaceBg = "#0E1217"
panelBg = "#141A22"
panelBorder = "#1E293B"

[ui.titleScreen]
eyebrow = "Fundación SCP · Protocolo de Contención"
title = "SITIO-19"
subtitle = "Archivo Táctico de Contención · Despliega personal de seguridad, investigadores y torretas para frenar brechas anómalas."
playButtonLabel = "Iniciar Turno"
almanacButtonLabel = "Archivo / Almanaque"
sectorsSectionLabel = "Sectores de Contención"

[ui.loadout]
title = "Preparar Escuadrón de Despliegue"
confirmButtonLabel = "Desplegar en Sector"
backButtonLabel = "Volver al Mapa"

[ui.hud]
retreatButtonLabel = "Retirada"
pauseButtonLabel = "Pausa"
resumeButtonLabel = "Reanudar"
almanacButtonLabel = "Archivo"
victoryTitle = "CONTENCIÓN RESTAURADA"
defeatTitle = "BRECHA DE CONTENCIÓN"
energyLabel = "ENERGÍA"

[ui.almanac]
modalTitle = "ARCHIVO CLASIFICADO · ALMANAQUE"
modalSubtitle = "Personaliza descripciones, lore, estadísticas, animaciones y diseño visual desde src/data/catalogue.toml"
scpsTabLabel = "Anomalías SCP"
towersTabLabel = "Personal y Estructuras"
loreSectionTitle = "Archivo & Descripción"
containmentSectionTitle = "Protocolo de Contención"
tacticalNoteTitle = "Nota Táctica"
statsSectionTitle = "Parámetros Técnicos"
customFieldsSectionTitle = "Ficha Técnica Clasificada"

