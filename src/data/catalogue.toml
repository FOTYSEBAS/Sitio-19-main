badgeText = "SOPORTE EN+"
accentColor = "#38BDF8"
clearanceLevel = "Nivel 1 / Logística"
threatRating = "Prioridad de Retaguardia"
lore = "Especialistas equipados con baterías de condensación portátil del Sitio-19. Canalizan energía ambiental para financiar despliegues rápidos."
containmentProcedures = "Desplegar en columnas traseras (Col. 0–1) tras líneas de Guardias."
tacticalNote = "Cada investigador aporta pulsos periódicos de energía táctica; protégelos de brechas rápidas."
quote = "Sin flujo en los condensadores, todo el perímetro defensivo queda a oscuras."
author = "Manual Operativo del Sitio-19"
tags = ["Logística", "Energía", "Personal", "Retaguardia"]
visualMode = "design"
designId = "towers:researcher"
cardBg = "#0E1621"
cardBorderColor = "rgba(56, 189, 248, 0.32)"

[[almanac.towers.researcher.customFields]]
